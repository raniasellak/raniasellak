<svg xmlns="http://www.w3.org/2000/svg" width="460" height="150" viewBox="0 0 460 150" role="img" aria-label="Signature: Rania Sellak">
  <style>
    @font-face { font-family: "Sig"; src: url(data:font/woff2;base64,) format("woff2"); }
    .sig { font-family: "Sig", cursive; font-size: 72px; fill: #10b981; fill-opacity: 0; stroke: #10b981; stroke-width: 1.1;
           stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3.2s ease forwards, fill .8s ease 2.6s forwards; }
    .flourish { fill: none; stroke: #10b981; stroke-width: 2; stroke-linecap: round;
                stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.2s ease 2.4s forwards; }
    .meta { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #8b949e; opacity: 0; animation: show .6s ease 3.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fill { to { fill-opacity: 1; } }
    @keyframes show { to { opacity: 1; } }
  </style>
  <text class="sig" x="230" y="82" text-anchor="middle">Rania Sellak</text>
  <path class="flourish" d="M70 104 C 150 92, 250 92, 330 100 S 410 112, 395 96" />
  <text class="meta" x="230" y="134" text-anchor="middle">// signed · web application security &amp; pentest</text>
</svg>
